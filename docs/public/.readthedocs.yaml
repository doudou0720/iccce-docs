version: 2

build:
  os: ubuntu-lts-latest
  tools:
    nodejs: "latest"
  jobs:
    build:
      html:
        # The site was created by running `vitepress init`
        # and following the official guide
        # https://vitepress.dev/guide/getting-started
        - mkdir -p $READTHEDOCS_OUTPUT/
        - git clone --depth 1 --branch page https://github.com/doudou0720/iccce-docs page-branch
        - mv page-branch $READTHEDOCS_OUTPUT/html
        - ls $READTHEDOCS_OUTPUT/html
