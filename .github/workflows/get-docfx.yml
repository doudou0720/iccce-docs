name: Generate DocFX Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - v2
    paths-ignore:
      - "./docs/**"
      - ".readthedocs.yml"
      - "package-lock.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  build-docfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout community repo
        uses: actions/checkout@v5
        with:
          repository: InkCanvasForClass/community
          path: community
          fetch-depth: 0

      - name: Clone docfx branch to community/output
        run: |
          git clone --branch docfx https://github.com/${{ github.repository }} community/output || true
          cd community/output
          git reset --soft HEAD~

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Copy docfx.json and related files
        run: |
          cp docfx.json community/docfx.json
          cp index.md community/index.md
          cp toc.yml community/toc.yml
          cp favicon.ico community/favicon.ico

      - name: Generate DocFX Document
        run: |
          cd community
          docfx docfx.json

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reset soft and update docs
        run: |
          cd community/output
          git add -A
          git commit -m "Update docfx documentation"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:docfx

  build-vitepress:
    runs-on: ubuntu-latest
    needs: build-docfx
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v5
        with:
          ref: v2
          fetch-depth: 1

      - name: Fetch docfx branch
        uses: actions/checkout@v5
        with:
          ref: docfx
          path: docs/dev
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build VitePress
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: docs/.vitepress/dist
          retention-days: 1

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout page branch
        uses: actions/checkout@v5
        with:
          ref: page
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: .

      - name: Push to page branch
        run: |
          git add -A
          git commit -m "Update VitePress documentation" || echo "No changes to commit"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:page
