name: Generate DocFX Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - v2
  schedule:
    - cron: "0 4 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

jobs:
  build-docfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout community repo
        uses: actions/checkout@v7
        with:
          repository: InkCanvasForClass/community
          path: community
          fetch-depth: 0

      - name: Clone docfx branch to community/output
        run: |
          git clone --branch docfx https://github.com/${{ github.repository }} community/output || true
          cd community/output
          git reset --hard HEAD~

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Copy docfx.json and related files
        run: |
          cp docfx.json community/docfx.json
          cp index.md community/index.md
          cp toc.yml community/toc.yml
          cp favicon.ico community/favicon.ico

      - name: Generate DocFX Document
        run: |
          cd community
          docfx docfx.json

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reset soft and update docs
        run: |
          cd community/output
          git add -A
          git commit -m "Update docfx documentation"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:docfx

  build-vitepress:
    runs-on: ubuntu-latest
    needs: build-docfx
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v7
        with:
          ref: v2
          fetch-depth: 0

      - name: Fetch docfx branch
        run: |
          git clone --depth 1 --branch docfx https://github.com/${{ github.repository }} /tmp/docfx
          rm -rf /tmp/docfx/.git

      - name: Checkout page branch
        uses: actions/checkout@v7
        with:
          ref: page
          fetch-depth: 0

      - name: Fetch v2 branch
        run: git fetch origin v2:v2

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Overwrite with v2 then add docfx to docs/dev
        run: |
          ls -A | grep -v '^\.git$' | xargs rm -rf
          git checkout v2 -- .
          rm -rf .github
          mkdir -p docs/dev
          cp -r /tmp/docfx/* docs/dev/ 2>/dev/null || true
          git add -A
          git commit -m "Update docs from v2 branch with docfx" || echo "No changes to commit"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:page
